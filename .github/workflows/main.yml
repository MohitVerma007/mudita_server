name: Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          ref: main  # Specify the main branch explicitly

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}  # Your server's SSH host
          username: ${{ secrets.USERNAME }}  # Your server's SSH username
          port: ${{ secrets.PORT }}  # Your server's SSH port
          key: ${{ secrets.SSH_PRIVATE_KEY }}  # Your SSH private key stored as a secret
          script: |
            cd /var/www/mudita_server
            git pull origin main  # Pull the latest changes from the main branch
            # Additional deployment steps if needed
